<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GNFT0GP8JS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GNFT0GP8JS');
  </script>  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="Marmotan projects">
  <title>Marmotan</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17211d;
      background: #f7f5ef;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
    }

    main {
      display: flex;
      width: min(100% - 40px, 760px);
      min-height: 100svh;
      margin: 0 auto;
      padding: 32px 0;
      flex-direction: column;
      justify-content: center;
    }

    header {
      display: flex;
      margin: 0 0 28px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 52px);
      letter-spacing: -.05em;
    }

    .github-link {
      color: #66716b;
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
    }

    .github-link:hover { color: #17211d; }

    .trainers {
      padding: 24px;
      border: 1px solid rgba(23, 33, 29, .1);
      border-radius: 24px;
      background: rgba(255, 255, 255, .45);
    }

    .trainers h2 {
      margin: 0 0 18px;
      font-size: clamp(20px, 4vw, 26px);
      line-height: 1.25;
      letter-spacing: -.025em;
    }

    nav {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    nav a {
      display: flex;
      min-height: 92px;
      padding: 20px;
      align-items: center;
      gap: 14px;
      border: 1px solid rgba(23, 33, 29, .13);
      border-radius: 18px;
      color: inherit;
      background: #fff;
      font-weight: 750;
      text-decoration: none;
      transition: border-color .15s, transform .15s;
    }

    nav a:hover {
      border-color: rgba(23, 33, 29, .38);
      transform: translateY(-2px);
    }

    nav a:focus-visible {
      outline: 3px solid rgba(40, 120, 92, .3);
      outline-offset: 3px;
    }

    .mark {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      place-items: center;
      border-radius: 13px;
      color: #fff;
      background: #17211d;
      font-size: 21px;
    }

    .project-title,
    .project-description { display: block; }

    .project-description {
      margin-top: 5px;
      color: #7a837e;
      font-size: 13px;
      font-weight: 450;
    }

    .arrow {
      margin-left: auto;
      color: #7a837e;
      font-weight: 400;
    }

    @media (max-width: 560px) {
      main { justify-content: flex-start; padding-top: 20vh; }
      .trainers { padding: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      nav a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>marmotan.ru</h1>
      <a class="github-link" href="https://github.com/Marm0t">GitHub ↗</a>
    </header>
    <section class="trainers" aria-labelledby="trainers-title">
      <h2 id="trainers-title">Handy trainers for Japanese beginners</h2>
      <nav aria-label="Japanese learning trainers">
        <a href="https://kazu.marmotan.ru/">
          <span class="mark" aria-hidden="true">数</span>
          <span>
            <span class="project-title">Kazu — Japanese Numbers</span>
            <span class="project-description">A trainer for memorizing Japanese numerals</span>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a href="https://yomu.marmotan.ru/">
          <span class="mark" aria-hidden="true">読</span>
          <span>
            <span class="project-title">Yomu — Kana Reading</span>
            <span class="project-description">A trainer for reading hiragana and katakana</span>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
